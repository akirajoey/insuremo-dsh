- insert:
    - id: workbench-test
      name: '@icomposer/plugin-workbench-test'

    - id: workbench-operation-log
      name: '@icomposer/workbench-operation-log'
      inject: [storageDomain]

    - id: workspace-binding
      name: '@icomposer/workspace-binding'
      inject: [storageDomain, workspaceRegistry]

    - id: icomposer-catalog
      name: '@icomposer/icomposer-catalog'
      inject: [workspaceBinding]

    - id: icomposer-reference
      name: '@icomposer/icomposer-reference'
      inject: [workspaceBinding]

    - id: insuremo-service
      name: '@icomposer/insuremo-service'
      inject: [subprocess, operationLog, skills, storageDomain, webServer]

    - id: ui-insuremo-settings
      name: '@icomposer/ui-insuremo-settings'

    - id: ui-insuremo-status
      name: '@icomposer/ui-insuremo-status'

    - id: ui-workbench-jobs
      name: '@icomposer/ui-workbench-jobs'
